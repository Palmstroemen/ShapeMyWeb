<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShapeMyWeb</title>
    <meta name="description" content="Die Einstellungsseite: Darstellung, Pakete, vermiedene Webseiten, Export und Import.">
    <link href="setup.css" type="text/css" rel="stylesheet">
    <script src="libraries/globalFunctions.js"></script>
    <script src="libraries/localize.js"></script>
    <script src="libraries/packages.js"></script>
    <script src="smw-setup.js"></script>
</head>

<body>
    <main>
        <header>
            <img src="images/icon-48.png" alt="" width="40" height="40">
            <div>
                <h1>ShapeMyWeb</h1>
                <p class="muted" lang="S001">Settings</p>
            </div>
        </header>

        <section id="designSetup">
            <h2 lang="D010">Appearance</h2>
            <div class="row">
                <label><input type="radio" name="design" id="setupDesignClassic" value="classic"> <span lang="D011">Funny</span></label>
                <label><input type="radio" name="design" id="setupDesignCalm" value="calm"> <span lang="D012">Professional</span></label>
            </div>
        </section>

        <section id="packages">
            <h2 lang="S010">Quick start</h2>
            <p class="muted" lang="S011">Ready-made packs.</p>
            <div id="packageList"></div>
            <p class="muted small" lang="S019">Added with avoid level 1.</p>
        </section>

        <section>
            <h2 lang="D013">Avoided websites</h2>
            <form id="newEntry" class="newEntry">
                <input id="newDomain" type="text" autocomplete="off" spellcheck="false">
                <input id="newReminder" type="text" autocomplete="off">
                <button id="addEntry" type="submit" class="primary" lang="S023">Add</button>
            </form>
            <p id="newDomainWarning" class="warning" lang="S024">That is not a valid website.</p>
            <div id="domainlist"></div>
        </section>

        <section>
            <h2 lang="S033">Back up and share</h2>
            <p class="muted" lang="S034">Save your list as a file.</p>
            <div class="row">
                <button id="exportList" type="button" lang="S035">Export</button>
                <label class="button" for="importFile"><span lang="S036">Import</span></label>
                <input id="importFile" type="file" accept=".json,application/json" hidden>
            </div>
            <p id="importResult" class="small"></p>
        </section>
    </main>
</body>

</html>
